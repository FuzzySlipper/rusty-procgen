[package]
name = "rusty-procgen-engine-spatial"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
engine-spatial = { git = "https://github.com/FuzzySlipper/rusty-engine", rev = "db5641fc4e9d033112bc2b374a35933c3838e39c" }
rusty-procgen-preflight = { path = "../../procgen-rs/crates/preflight" }
serde = { version = "1.0.219", features = ["derive"] }
